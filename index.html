<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<title>Singapur 3D para peques</title>
<meta name="description" content="Juegos 3D de matemáticas con el método Singapur para niños de 2 a 5 años, con voz y sonido.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Singapur 3D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 0%,#8ed6ff,#dff5ff 58%,#bff0d4);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:#2b2540}
#c{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:900;font-size:1.05rem;line-height:1.4}</style>
</head><body><div id="c">☁️ Cargando a Numi…</div>
<script>
(async()=>{
  const N=7,parts=[];
  for(let i=1;i<=N;i++){const r=await fetch('src/c'+i+'.txt');if(!r.ok)throw new Error('parte '+i+': '+r.status);parts.push((await r.text()).replace(/^\s*~/,''))}
  const bin=atob(parts.join('')),bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  let html;
  if(window.DecompressionStream){
    html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }else{
    await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    html=window.pako.ungzip(bytes,{to:'string'});
  }
  if(html.indexOf('Singapur')<0)throw new Error('contenido incompleto');
  document.open();document.write(html);document.close();
})().catch(()=>{document.getElementById('c').innerHTML='No se pudo cargar la app.<br>Revisa la conexión y recarga la página.'});
</script></body></html>
