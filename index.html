function grid(n,cols,sp,cx,cz){const a=[];for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols,k=Math.min(cols,n-r*cols);a.push([cx+(c-(k-1)/2)*sp,cz+r*sp])}return a}
function burst(p){const c=p||new T.Vector3(0,2,0);for(let i=0;i<50;i++){const m=new T.Mesh(new T.BoxGeometry(.16,.16,.16),new T.MeshBasicMaterial({color:pick(COL)}));m.position.set(c.x+(Math.random()-.5)*1.6,c.y+Math.random()*.8,c.z+(Math.random()-.5)*1.4);m.userData={v:new T.Vector3((Math.random()-.5)*7,Math.random()*7+2.5,(Math.random()-.5)*5),l:1.7};sc.add(m);cf.push(m)}}
function ripple(x,z){const r=new T.Mesh(new T.RingGeometry(.26,.34,44),new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,side:T.DoubleSide,depthWrite:false}));r.rotation.x=-Math.PI/2;r.position.set(x,.05,z);r.userData.t=0;sc.add(r);rips.push(r)}

cam.lookAt(0,.75,-.4);
objs.forEach(o=>{const u=o.userData;if(!u.still)o.rotation.y+=dt*.8;
if(u.ph!==undefined&&!(u.hop>0))o.position.y=u.y0+Math.sin(s*1.4+u.ph)*.035;
if(u.hop>0){u.hop-=dt*1.8;o.position.y=u.y0+Math.sin(Math.max(0,u.hop)*Math.PI)*.95}
const k=o.scale.x+((u.s||1)-o.scale.x)*Math.min(1,dt*10);if(!u.np)o.scale.setScalar(k)});
for(let i=tws.length-1;i>=0;i--){const t=tws[i];t.t+=dt*1000;const k=Math.min(1,t.t/t.ms),e=k*k*(3-2*k);t.o.position.lerpVectors(t.p0,t.p,e);if(k>=1){t.o.userData.y0=t.p.y;tws.splice(i,1)}}
for(let i=cf.length-1;i>=0;i--){const m=cf[i],u=m.userData;u.v.y-=15*dt;m.position.addScaledVector(u.v,dt);m.rotation.x+=dt*7;u.l-=dt;if(u.l<=0||m.position.y<-1){sc.remove(m);cf.splice(i,1)}}
for(let i=rips.length-1;i>=0;i--){const r=rips[i];r.userData.t+=dt;const k=r.userData.t/.75;r.scale.setScalar(1+k*4.5);r.material.opacity=.9*(1-k);if(k>=1){sc.remove(r);rips.splice(i,1)}}
sc.children.forEach(c=>{if(c.userData.cl){c.position.x+=dt*.35;if(c.position.x>16)c.position.x=-16}});
if(sc.userData.dust){sc.userData.dust.rotation.y=s*.014;sc.userData.dust.position.y=Math.sin(s*.25)*.35}
if(mh>0)mh-=dt;mas.position.y=.8+Math.abs(Math.sin(s*2))*.1+(mh>0?Math.sin(Math.max(0,mh)/1.5*Math.PI)*1.2:0)+(talking?Math.abs(Math.sin(s*8))*.05:0);mas.rotation.y=Math.sin(s)*.3;
const mo=mas.userData.mouth;if(mo){const k=talking?(.35+.85*Math.abs(Math.sin(s*13))):1;mo.scale.set(1.05+(talking?Math.sin(s*9)*.1:0),.5*k,.6)}
if(mas){bv.copy(mas.position);bv.y+=1.05;bv.project(cam);const b=$('#bub');if(bv.z<1){b.style.left=Math.max(17,Math.min(83,((bv.x*.5+.5)*100)))+'%';b.style.top=((.5-bv.y*.5)*100)+'%'}}
R3.render(sc,cam)}

pick(o){const u=o.userData;if(u.d||q.fin||q.c>=q.n)return;u.d=1;q.c++;o.material.emissive.setHex(0x1a7a4a);u.hop=1;beep(380+q.c*50);say(NUM[q.c]);hud(NUM[q.c]+' ('+q.c+')');

start(){clr();const m=cap();let a=rnd(1,m),b=rnd(1,m);if(a==b)b=a%m+1;q={a,b,more:Math.random()<.6};const cA=rnd(0,2),cB=rnd(3,5);
grid(a,3,1.1,-2.7,-.3).forEach(p=>{mk(1,cA,p[0],.5,p[1]).userData.side='a'});

const t='¿Dónde hay '+(q.more?'más':'menos')+'?';hud(t);say('Mira los dos grupos: uno tiene más y otro tiene menos. '+t+' Toca el grupo correcto.')},
pick(o){if(q.fin)return;const big=q.a>q.b?'a':'b',sm=big=='a'?'b':'a',right=q.more?big:sm;

G.partes={tip:'Adulto: “El total se puede partir en dos grupos”. Busquen todas las formas. Es la base de sumar y restar (enlaces de número).',
start(){clr();const t=rnd(2,Math.min(5,cap()+1));q={t,seen:{},n:0,need:Math.floor(t/2)};box(6,2,0x9fd2ff,0,1.2);box(6,2,0xffc08a,0,-1.6);
for(let i=0;i<t;i++){const m=mk(0,1,(i-(t-1)/2)*1.2,.6,1.2);m.userData.sd=0}
hud('Pasa bolitas al grupo naranja: '+t+' = ? + ?');say('Tenemos '+NUM[t]+'. Vamos a partirlo en dos grupos. Toca una bolita para pasarla al grupo naranja, y mira cuántas quedan.')},
pick(o){if(q.fin)return;const u=o.userData;u.sd^=1;o.material.color.setHex(COL[u.sd?0:1]);tw(o,new T.Vector3(o.position.x,.6,u.sd?-1.6:1.2),450);beep(500);
const bl=objs.filter(x=>x.userData.sd===0).length,or=q.t-bl;hud(q.t+' = '+bl+' + '+or+'   ('+q.n+'/'+q.need+')');

const s=sub?'Hay '+NUM[tot]+'. Se van '+NUM[b]+'. ¿Cuántos quedan?':'Hay '+NUM[a]+'. Llegan '+NUM[b]+'. ¿Cuántos hay en total?';hud(sub?tot+' − '+b+' = ?':a+' + '+b+' = ?');say(s+' Toca el botón '+(sub?'Quitar':'Juntar')+'.');

if(!sub)objs.slice(a).forEach((o,i)=>tw(o,new T.Vector3(x(a+i),.5,1.2)));else objs.slice(a).forEach(o=>{o.userData.s=.01;tw(o,new T.Vector3(o.position.x,3,1.2))});
